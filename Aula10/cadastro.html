<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editora Br@sil - Nova Assinatura (Aula 10)</title>
    <link rel="stylesheet" type="text/css" href="estilo.css">
</head>
<body>

    <div id="conteudo">
        <div class="barra-servidor">
            <span><strong>Laboratório 07:</strong> Decisões + MySQL</span>
            <a href="exemplos.php">📚 Ver Exemplos Teóricos (if / empty / mysqli)</a>
        </div>

        <h2>Editora Br@sil - Assinatura de Revistas</h2>
        <p class="subtitulo">
            Preencha os campos abaixo (ou deixe um em branco para testar o <code>if (empty(...))</code> no servidor!).
        </p>

        <form action="processa_cadastro.php" method="POST">
            <div class="grupo-campo">
                <label for="nome_assinante">Nome Completo:</label>
                <input type="text" id="nome_assinante" name="nome_assinante" class="campo" size="35" placeholder="Digite seu nome completo">
            </div>

            <div class="grupo-campo">
                <label for="email_assinante">E-mail de Contato:</label>
                <input type="email" id="email_assinante" name="email_assinante" class="campo" size="35" placeholder="exemplo@dominio.com">
            </div>

            <div class="grupo-campo">
                <label for="plano_escolhido">Plano Escolhido:</label>
                <select id="plano_escolhido" name="plano_escolhido" class="campo">
                    <option value="">Selecione um plano...</option>
                    <option value="Revista Semestral">Revista Semestral - R$ 59,90</option>
                    <option value="Revista Anual">Revista Anual - R$ 99,90</option>
                    <option value="Plano Digital VIP">Plano Digital VIP - R$ 120,00</option>
                </select>
            </div>

            <p>
                <input type="submit" class="botao" value="Avançar para Assinatura">
            </p>
        </form>
    </div>

</body>
</html>
